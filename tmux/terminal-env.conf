# terminal-env: tmux の設定(リモートの Linux 機用)
# ~/.tmux.conf に次の 1 行を足して読み込む:
#   source-file ~/terminal-env/tmux/terminal-env.conf
# (clone した場所が違う場合はパスを合わせる。bin/ の 2 本は ~/.local/bin から呼べるようにしておく。README 参照)

set -g mouse on
set -g focus-events on
set -g default-terminal "tmux-256color"
# 24bit カラー / 貼り付けに印を付ける(bpaste。ツリーへのドラッグ&ドロップを「貼り付け」として受け取るのに要る)
# 番号を決めて入れる(-a で足すと、設定を読み直すたびに同じものが増えていく)
set -s terminal-features[90] "xterm-256color:RGB:bpaste"
# 手元の WezTerm のタブ名を、開いているフォルダ名にする(セッションを作ったフォルダ)
set -g set-titles on
set -g set-titles-string "#{b:session_path}"
# wopen の合図・Claude Code の状態(OSC 1337)を手元の WezTerm まで通す。all = 見えていない window の pane からも
set -g allow-passthrough all
set -g set-clipboard on                           # nvim などのコピー(OSC 52)を手元のクリップボードへ

# Shift+Alt で pane を操作する(prefix 不要。WezTerm のローカル pane と同じキー)
# Shift+Alt+- は JIS 配列では M-=、US 配列では M-_ として届く。Shift+Alt++ は M-+
bind -n M-=  split-window -v -c '#{pane_current_path}'
bind -n M-_  split-window -v -c '#{pane_current_path}'
bind -n M-+  split-window -h -c '#{pane_current_path}'
bind -n M-W  confirm-before -p "pane #P を閉じますか? (y/n)" kill-pane
bind -n M-Z  resize-pane -Z
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3
bind -n M-S-Left  resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
# Shift+Alt+E: 左端にツリー(nvim + neo-tree)を出す / ツリーへ移る / ツリーにいれば閉じる
bind -n M-E  run-shell -b '$HOME/.local/bin/tmux-tree "#{pane_id}"'
# ツリーの幅を保つ: 窓の大きさが変わっても引き伸ばさない / 境目をドラッグして変えた幅は覚える
# (ツリーを出したことのある窓だけ。境目のドラッグ中は何度も呼ばれるので、それ以外ではシェルを起動しない)
set-hook -g window-resized      { if -F "#{@tree_w}" { run-shell -b "$HOME/.local/bin/tmux-tree --fit #{window_id}" } }
set-hook -g after-resize-pane   { if -F "#{@tree_w}" { run-shell -b "$HOME/.local/bin/tmux-tree --remember #{window_id}" } }
# WezTerm からつないだとき
#   ・設定が変わる前に起動したツリーを作り直す(セッションは残るため、古い設定のまま動き続けないように)
#   ・Claude Code の状態をタブに送り直す
set-hook -g client-attached     'run-shell -b "$HOME/.local/bin/tmux-tree --refresh"; run-shell -b "$HOME/.local/bin/tenv-cc-state --sync #{q:session_name}"'
# pane を見たら、Claude Code の「完了」の印を消す(完了の印がある pane だけ。pane を移るたびにシェルを起動しない)
set-hook -g pane-focus-in       { if -F "#{==:#{@cc_state},done}" { run-shell -b "$HOME/.local/bin/tenv-cc-state --focus #{pane_id}" } }

# ダブル / トリプルクリック: マウスを使うアプリ(ツリーなど)の上では pane を選び直さない。
# tmux は 3 回目のクリックを待ってから処理するため、標準のままだと、ツリーのダブルクリックで
# エディタへ移った直後にツリーへ引き戻される。アプリが使っていない pane では標準どおり(単語 / 行を選んでコピー)
bind -n DoubleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { select-pane -t = ; copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
# 右クリック: マウスを使うアプリ(ツリー・Claude Code など)にはそのまま渡す。
# それ以外の pane では tmux 標準の英語メニュー(Kill などを含む)を出さず、範囲選択中ならコピーするだけにする
# (貼り付けは Ctrl+V。Alt+右クリックで tmux のメニューは出せる)
bind -n MouseDown3Pane if -F -t = "#{mouse_any_flag}" { select-pane -t = ; send-keys -M } { select-pane -t = ; if -F "#{pane_in_mode}" { send-keys -X copy-pipe-and-cancel } }
bind -n TripleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { select-pane -t = ; copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }

# 最下段のステータス行は既定で出さない(セッション名はタブ名、時刻は WezTerm の右上に出ている)。
# Shift+Alt+S で出す / 隠す
set -g status off
bind -n M-S  set -g status

# 見た目: 色は端末の 16 色で指定する(WezTerm のテーマを替えると tmux も追従する)
set -g status-style "bg=default,fg=brightblack"
set -g status-justify centre
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=blue,bold] #I #W "
set -g pane-border-lines single
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue,bold"
set -g mode-style "bg=blue,fg=black"
